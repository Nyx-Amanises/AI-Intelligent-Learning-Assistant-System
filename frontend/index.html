<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b6150" />
    <meta name="description" content="上传学习资料，生成总结和练习题，在错题与统计中找到需要复习的地方。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=zhixu-seal" />
    <title>知序</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ai-learning-theme');
          if (t !== 'eye-care') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f7a5a" />
    <meta name="description" content="整理学习资料，用 AI 理清知识，通过练习与复盘让每一次学习都有所收获。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=zhixu-seal" />
    <title>知序</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ai-learning-theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

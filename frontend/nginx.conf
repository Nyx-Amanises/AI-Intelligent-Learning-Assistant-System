server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # SSE 需要逐事件转发；只对流式消息接口关闭缓冲，普通 API 保持原行为。
    location ~ ^/api/assistant/sessions/[0-9]+/messages/stream$ {
        # 正则 location 的 proxy_pass 不带 URI，原始路径、查询参数和 POST 请求体保持不变。
        proxy_pass http://backend:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Accept-Encoding "";

        # 后端 SSE 生命周期为 300 秒，代理超时应留出结束事件与清理时间。
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        send_timeout 360s;
    }

    location /api/ {
        proxy_pass http://backend:8083/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
